<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc">
  <title id="title">CrispyWaffle package architecture</title>
  <desc id="desc">The core CrispyWaffle package exposes static facades with extension points. Integration packages implement those extension points, some through CrispyWaffle.Configuration. BackgroundJobs and HttpClient are standalone.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0c4dc"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #f8f8f2; }
    .mono { font-family: "Cascadia Code", Consolas, "SF Mono", Menlo, monospace; font-variant-ligatures: none; }
    .dim { fill: #a9adc8; }
    .b { font-weight: 600; }
    .card { fill: #343746; stroke: #44475a; }
    .pill { font-size: 11px; }
  </style>

  <rect width="1000" height="930" fill="#282a36"/>

  <text x="40" y="44" font-size="20" class="b">CrispyWaffle — package architecture</text>
  <text x="40" y="68" font-size="13" class="dim">One core package of static facades; integration packages plug into its extension points.</text>

  <!-- Application -->
  <rect x="40" y="90" width="920" height="44" rx="8" fill="#44475a"/>
  <text x="60" y="117" font-size="14" class="b">Your application</text>
  <text x="190" y="117" font-size="12" class="dim mono">LogConsumer.Info(…)  ·  CacheManager.GetAsync(…)  ·  EventsConsumer.Raise(…)  ·  ServiceLocator.Resolve&lt;T&gt;()</text>
  <line x1="500" y1="134" x2="500" y2="158" stroke="#c0c4dc" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Core -->
  <rect x="40" y="160" width="920" height="236" rx="10" fill="#2f3141" stroke="#bd93f9" stroke-width="1.5"/>
  <text x="60" y="186" font-size="15" class="b mono">CrispyWaffle</text>
  <text x="180" y="186" font-size="12" class="dim">core package — static facades with pluggable extension points</text>

  <!-- Row 1 -->
  <g>
    <rect x="60" y="202" width="208" height="64" rx="6" class="card"/>
    <rect x="60" y="202" width="4" height="64" fill="#bd93f9"/>
    <text x="76" y="228" font-size="14" class="b">Composition</text>
    <text x="76" y="250" font-size="12" class="mono dim">ServiceLocator</text>

    <rect x="284" y="202" width="208" height="64" rx="6" class="card"/>
    <rect x="284" y="202" width="4" height="64" fill="#ff79c6"/>
    <text x="300" y="228" font-size="14" class="b">Log</text>
    <text x="300" y="250" font-size="12" class="mono dim">LogConsumer</text>

    <rect x="508" y="202" width="208" height="64" rx="6" class="card"/>
    <rect x="508" y="202" width="4" height="64" fill="#8be9fd"/>
    <text x="524" y="228" font-size="14" class="b">Cache</text>
    <text x="524" y="250" font-size="12" class="mono dim">CacheManager</text>

    <rect x="732" y="202" width="208" height="64" rx="6" class="card"/>
    <rect x="732" y="202" width="4" height="64" fill="#ffb86c"/>
    <text x="748" y="228" font-size="14" class="b">Telemetry</text>
    <text x="748" y="250" font-size="12" class="mono dim">TelemetryAnalytics</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="60" y="278" width="208" height="64" rx="6" class="card"/>
    <rect x="60" y="278" width="4" height="64" fill="#50fa7b"/>
    <text x="76" y="304" font-size="14" class="b">Events</text>
    <text x="76" y="326" font-size="12" class="mono dim">EventsConsumer</text>

    <rect x="284" y="278" width="208" height="64" rx="6" class="card"/>
    <rect x="284" y="278" width="4" height="64" fill="#50fa7b"/>
    <text x="300" y="304" font-size="14" class="b">Commands</text>
    <text x="300" y="326" font-size="12" class="mono dim">CommandsConsumer</text>

    <rect x="508" y="278" width="208" height="64" rx="6" class="card"/>
    <rect x="508" y="278" width="4" height="64" fill="#f1fa8c"/>
    <text x="524" y="304" font-size="14" class="b">Scheduler (cron)</text>
    <text x="524" y="326" font-size="12" class="mono dim">JobManager</text>

    <rect x="732" y="278" width="208" height="64" rx="6" class="card"/>
    <rect x="732" y="278" width="4" height="64" fill="#9aa5ff"/>
    <text x="748" y="304" font-size="14" class="b">Serialization</text>
    <text x="748" y="326" font-size="12" class="mono dim">SerializerFactory</text>
  </g>

  <!-- Other namespaces -->
  <text x="60" y="373" font-size="12" class="dim">Also:</text>
  <g class="mono pill">
    <rect x="100" y="356" width="82" height="24" rx="12" fill="#44475a"/><text x="141" y="372" text-anchor="middle" class="mono pill">Extensions</text>
    <rect x="190" y="356" width="75" height="24" rx="12" fill="#44475a"/><text x="227.5" y="372" text-anchor="middle" class="mono pill">Utilities</text>
    <rect x="273" y="356" width="89" height="24" rx="12" fill="#44475a"/><text x="317.5" y="372" text-anchor="middle" class="mono pill">Validations</text>
    <rect x="370" y="356" width="95" height="24" rx="12" fill="#44475a"/><text x="417.5" y="372" text-anchor="middle" class="mono pill">Cryptography</text>
    <rect x="473" y="356" width="128" height="24" rx="12" fill="#44475a"/><text x="537" y="372" text-anchor="middle" class="mono pill">TemplateRendering</text>
    <rect x="609" y="356" width="102" height="24" rx="12" fill="#44475a"/><text x="660" y="372" text-anchor="middle" class="mono pill">GoodPractices</text>
    <rect x="719" y="356" width="82" height="24" rx="12" fill="#44475a"/><text x="760" y="372" text-anchor="middle" class="mono pill">Attributes</text>
  </g>

  <!-- Configuration -->
  <rect x="40" y="426" width="760" height="40" rx="8" fill="#343746" stroke="#f1fa8c" stroke-width="1.2"/>
  <text x="60" y="451" font-size="13" class="b mono">CrispyWaffle.Configuration</text>
  <text x="280" y="451" font-size="12" class="dim">IConnection · Credentials · SecureCredentialProvider — shared connection settings</text>
  <line x1="420" y1="426" x2="420" y2="398" stroke="#c0c4dc" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows from integrations -->
  <line x1="420" y1="496" x2="420" y2="468" stroke="#c0c4dc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="487" font-size="11" class="dim">packages marked cfg</text>
  <line x1="880" y1="496" x2="880" y2="398" stroke="#c0c4dc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="890" y="451" font-size="11" class="dim">all</text>

  <!-- Integration packages -->
  <rect x="40" y="496" width="920" height="270" rx="10" fill="#2f3141" stroke="#44475a"/>
  <text x="60" y="522" font-size="15" class="b">Integration packages</text>
  <text x="222" y="522" font-size="12" class="dim">CrispyWaffle.* — each implements one or more core extension points</text>

  <!-- Row 1: Redis, RabbitMQ, ElasticSearch, CouchDB, Log4Net -->
  <g>
    <rect x="60" y="536" width="163" height="112" rx="6" class="card"/>
    <text x="72" y="560" font-size="14" class="b">Redis</text>
    <rect x="185" y="547" width="28" height="16" rx="4" fill="none" stroke="#f1fa8c"/><text x="199" y="559" font-size="10" text-anchor="middle" class="mono" fill="#f1fa8c" style="fill:#f1fa8c">cfg</text>
    <rect x="72" y="570" width="128" height="20" rx="10" fill="none" stroke="#8be9fd"/><text x="136" y="584" text-anchor="middle" class="mono pill" style="fill:#8be9fd">ICacheRepository</text>
    <rect x="72" y="596" width="128" height="20" rx="10" fill="none" stroke="#ff79c6"/><text x="136" y="610" text-anchor="middle" class="mono pill" style="fill:#ff79c6">ILogProvider</text>
    <rect x="72" y="622" width="128" height="20" rx="10" fill="none" stroke="#ffb86c"/><text x="136" y="636" text-anchor="middle" class="mono pill" style="fill:#ffb86c">ITelemetryClient</text>

    <rect x="239" y="536" width="163" height="112" rx="6" class="card"/>
    <text x="251" y="560" font-size="14" class="b">RabbitMQ</text>
    <rect x="364" y="547" width="28" height="16" rx="4" fill="none" stroke="#f1fa8c"/><text x="378" y="559" font-size="10" text-anchor="middle" class="mono" style="fill:#f1fa8c">cfg</text>
    <rect x="251" y="570" width="128" height="20" rx="10" fill="none" stroke="#ff79c6"/><text x="315" y="584" text-anchor="middle" class="mono pill" style="fill:#ff79c6">ILogProvider</text>
    <rect x="251" y="596" width="128" height="20" rx="10" fill="none" stroke="#a9adc8"/><text x="315" y="610" text-anchor="middle" class="mono pill dim">RabbitMQWrapper</text>

    <rect x="418" y="536" width="163" height="112" rx="6" class="card"/>
    <text x="430" y="560" font-size="14" class="b">ElasticSearch</text>
    <rect x="543" y="547" width="28" height="16" rx="4" fill="none" stroke="#f1fa8c"/><text x="557" y="559" font-size="10" text-anchor="middle" class="mono" style="fill:#f1fa8c">cfg</text>
    <rect x="430" y="570" width="128" height="20" rx="10" fill="none" stroke="#ff79c6"/><text x="494" y="584" text-anchor="middle" class="mono pill" style="fill:#ff79c6">ILogProvider</text>
    <rect x="430" y="596" width="128" height="20" rx="10" fill="none" stroke="#a9adc8"/><text x="494" y="610" text-anchor="middle" class="mono pill dim">ElasticWrapper</text>

    <rect x="597" y="536" width="163" height="112" rx="6" class="card"/>
    <text x="609" y="560" font-size="14" class="b">CouchDB</text>
    <rect x="722" y="547" width="28" height="16" rx="4" fill="none" stroke="#f1fa8c"/><text x="736" y="559" font-size="10" text-anchor="middle" class="mono" style="fill:#f1fa8c">cfg</text>
    <rect x="609" y="570" width="128" height="20" rx="10" fill="none" stroke="#8be9fd"/><text x="673" y="584" text-anchor="middle" class="mono pill" style="fill:#8be9fd">ICacheRepository</text>

    <rect x="776" y="536" width="163" height="112" rx="6" class="card"/>
    <text x="788" y="560" font-size="14" class="b">Log4Net</text>
    <rect x="788" y="570" width="128" height="20" rx="10" fill="none" stroke="#ff79c6"/><text x="852" y="584" text-anchor="middle" class="mono pill" style="fill:#ff79c6">ILogProvider</text>
  </g>

  <!-- Row 2: EventLog, Elmah, Utils, I18n.PtBr, legend -->
  <g>
    <rect x="60" y="664" width="163" height="86" rx="6" class="card"/>
    <text x="72" y="688" font-size="14" class="b">EventLog</text>
    <rect x="72" y="698" width="128" height="20" rx="10" fill="none" stroke="#ff79c6"/><text x="136" y="712" text-anchor="middle" class="mono pill" style="fill:#ff79c6">ILogProvider</text>

    <rect x="239" y="664" width="163" height="86" rx="6" class="card"/>
    <text x="251" y="688" font-size="14" class="b">Elmah</text>
    <rect x="251" y="698" width="128" height="20" rx="10" fill="none" stroke="#ff79c6"/><text x="315" y="712" text-anchor="middle" class="mono pill" style="fill:#ff79c6">IExceptionHandler</text>

    <rect x="418" y="664" width="163" height="86" rx="6" class="card"/>
    <text x="430" y="688" font-size="14" class="b">Utils</text>
    <rect x="543" y="675" width="28" height="16" rx="4" fill="none" stroke="#f1fa8c"/><text x="557" y="687" font-size="10" text-anchor="middle" class="mono" style="fill:#f1fa8c">cfg</text>
    <rect x="430" y="698" width="128" height="20" rx="10" fill="none" stroke="#a9adc8"/><text x="494" y="712" text-anchor="middle" class="mono pill dim">FtpClient</text>
    <rect x="430" y="724" width="128" height="20" rx="10" fill="none" stroke="#a9adc8"/><text x="494" y="738" text-anchor="middle" class="mono pill dim">SmtpMailer</text>

    <rect x="597" y="664" width="163" height="86" rx="6" class="card"/>
    <text x="609" y="688" font-size="14" class="b">I18n.PtBr</text>
    <rect x="609" y="698" width="128" height="20" rx="10" fill="none" stroke="#a9adc8"/><text x="673" y="712" text-anchor="middle" class="mono pill dim">pt-BR conversions</text>

    <!-- Legend -->
    <text x="780" y="684" font-size="11" class="b dim">Legend</text>
    <rect x="780" y="693" width="10" height="10" rx="5" fill="none" stroke="#8be9fd"/><text x="798" y="702" font-size="11" class="dim">cache extension point</text>
    <rect x="780" y="709" width="10" height="10" rx="5" fill="none" stroke="#ff79c6"/><text x="798" y="718" font-size="11" class="dim">log extension point</text>
    <rect x="780" y="725" width="10" height="10" rx="5" fill="none" stroke="#ffb86c"/><text x="798" y="734" font-size="11" class="dim">telemetry extension point</text>
    <rect x="780" y="741" width="10" height="10" rx="5" fill="none" stroke="#a9adc8"/><text x="798" y="750" font-size="11" class="dim">package-specific API</text>
  </g>

  <!-- Standalone -->
  <rect x="40" y="796" width="920" height="108" rx="10" fill="#2f3141" stroke="#44475a" stroke-dasharray="6 4"/>
  <text x="60" y="822" font-size="15" class="b">Standalone packages</text>
  <text x="222" y="822" font-size="12" class="dim">built on Microsoft.Extensions.* — no dependency on the core</text>

  <rect x="60" y="836" width="430" height="56" rx="6" class="card"/>
  <text x="76" y="858" font-size="14" class="b">BackgroundJobs</text>
  <text x="76" y="879" font-size="11" class="mono dim">JobDispatcher → IJobStore → BackgroundWorker</text>

  <rect x="510" y="836" width="430" height="56" rx="6" class="card"/>
  <text x="526" y="858" font-size="14" class="b">HttpClient</text>
  <text x="526" y="879" font-size="11" class="mono dim">IHttpClientWrapper · RetryPolicy · HttpResponse&lt;T&gt;</text>
</svg>
