  - Integration Packages:
      - Configuration: packages/configuration.md
      - Redis: packages/redis.md
      - RabbitMQ: packages/rabbitmq.md
      - ElasticSearch: packages/elasticsearch.md
      - CouchDB: packages/couchdb.md
      - Log4Net: packages/log4net.md
      - EventLog: packages/eventlog.md
      - Elmah: packages/elmah.md
      - Utils: packages/utils.md
