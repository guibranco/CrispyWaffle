name: Temporary TOML validation

on:
  push:
    branches:
      - feature/toml-serializer

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      couchdb:
        image: couchdb:3
        env:
          COUCHDB_USER: Admin
          COUCHDB_PASSWORD: myP@ssw0rd
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl -f http://localhost:5984/_up || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests and capture diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          dotnet test --no-build --configuration Release --logger "console;verbosity=detailed" 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test diagnostics
        if: steps.tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-output.log
          retention-days: 1

      - name: Fail when tests fail
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
